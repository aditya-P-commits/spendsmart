<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendSmart - Note Down Expense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

  <nav class="py-2 navbar navbar-expand bg-white border-bottom sticky-top">
    <div class="container d-flex flex-wrap justify-content-between align-items-center">
      <a class="d-flex gap-2 navbar-brand align-items-center" href="dashboard.html">
        <i class="text-primary fs-4 bi bi-wallet2"></i>
        <span>Spend<span class="text-success">Smart</span></span>
      </a>
      <ul class="navbar-nav ">
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-house-door "></i> Home</a>
        </li>
        <li class="nav-item"><a class="nav-link fw-semibold text-primary active" href="add-expense.html"><i
              class="bi bi-plus-circle "></i> Add Expense</a></li>
        <li class="nav-item"><a class="nav-link" href="view-expenses.html"><i class="bi bi-table "></i> View
            Expenses</a></li>
        
        <li class="nav-item"><a class="nav-link" href="about.html"><i class="me-1 bi bi-info-circle"></i>About</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">

    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb small">
        <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Note Down Expense</li>
      </ol>
    </nav>

    <div class="mb-4 text-center">
      <h2 class="fw-bold">Note Down Expense</h2>
      <p class="text-muted">Fill out this form to log your daily pocket expense.</p>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">

        <div class="p-4 card">
          <form action="view-expenses.html" method="get">

            <div class="mb-3">
              <label for="expenseName" class="form-label fw-semibold">
                Expense Name <span class="text-danger">*</span>
              </label>
              <input type="text" class="form-control" id="expenseName" name="name"
                placeholder="e.g. Canteen Lunch, Bus Pass, Printouts" required>
              <div>What did you spend money on?</div>
            </div>

            <div class="mb-3">
              <label for="expenseAmount" class="form-label fw-semibold">
                Amount <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text">₹</span>
                <input type="number" class="form-control" id="expenseAmount" name="amount" placeholder="e.g. 150"
                  min="1" step="any" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="expenseDate" class="form-label fw-semibold">
                Date of Expense <span class="text-danger">*</span>
              </label>
              <input type="date" class="form-control" id="expenseDate" name="date" required>
            </div>

            <div class="mb-3">
              <label for="expenseCategory" class="form-label fw-semibold">
                Category <span class="text-danger">*</span>
              </label>
              <select class="form-select" id="expenseCategory" name="category" required>
                <option value="" disabled selected>Select a category...</option>
                <option value="Food">Food &amp; Canteen</option>
                <option value="Transport">Transport &amp; Travel</option>
                <option value="Education">Education &amp; Books</option>
                <option value="Shopping">Shopping &amp; Personal</option>
                <option value="Entertainment">Entertainment &amp; Outing</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="d-block form-label fw-semibold">Payment Mode</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="paymentMode" id="payUPI" value="UPI" checked>
                <label class="form-check-label small" for="payUPI">UPI / GPay</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="paymentMode" id="payCash" value="Cash">
                <label class="form-check-label small" for="payCash">Cash</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="paymentMode" id="payCard" value="Card">
                <label class="form-check-label small" for="payCard">Debit Card</label>
              </div>
            </div>

            <div class="mb-4">
              <label for="expenseRemarks" class="form-label fw-semibold">
                Remarks (Optional)
              </label>
              <textarea class="form-control" id="expenseRemarks" name="remarks" rows="2"
                placeholder="e.g. Shared with roommates"></textarea>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="flex-grow-1 btn btn-primary">
                <i class="me-1 bi bi-check-lg"></i>Save Expense
              </button>
              <a href="dashboard.html" class="btn btn-outline-secondary">Cancel</a>
            </div>

          </form>
        </div>

      </div>
    </div>

  </main>

  <footer class="bg-white border-top text-center footer ">
    <div class="container">
      <div><strong>SpendSmart</strong> — Mini Project</div>
      <div class="text-secondary ">Built with HTML5, CSS3 &amp; Bootstrap 5.3</div>
    </div>
  </footer>

</body>

</html>
